<!DOCTYPE html>
<html lang="en">

    <title>박하솔</title>

            color: #333;
        }

        .container {
            width: 700px;

            border: 0;
            border-top: 1px solid #ddd;
        }

        h2 {
            margin-bottom: 20px;
        }

        .info {
            display: flex;
            gap: 15px;
        }

        .box {
            flex: 1;
            padding: 20px;
            background-color: #f7f7f7;
            border-radius: 15px;
            text-align: center;
        }

        .skills span {
            display: inline-block;
            padding: 10px 18px;
            margin: 5px;
            background-color: #eee;
            border-radius: 20px;
        }

        .contact {
            text-align: center;
            padding: 20px;
            background-color: #f7f7f7;
            border-radius: 15px;
        }
    </style>
</head>
